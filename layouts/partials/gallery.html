<section class="photo-section"><div class="photo-feed">{{ range .Posts }}{{ $post := . }}{{ with .Params.photos }}{{ range . }}<div class="grid-item"><figure class="photo-card"><a class="post-link" href="{{ $post.Permalink }}"><img class="post-image" src="{{ . }}" alt="{{ $post.Title }}" loading="lazy"></a><figcaption class="post-caption"><h2 class="post-caption-title">{{ $post.Title }}</h2><div class="post-caption-meta"><time>{{ $post.Date.Format "02 Jan 2006" }}</time></div></figcaption></figure></div>{{ end }}{{ end }}{{ else }}<p>No gallery posts are published yet.</p>{{ end }}</div></section>
