<section class="cactus-section listening-archive"><div class="listening-grid">{{ range . }}<article class="listening-card"><a class="listening-card-link" href="{{ .Permalink }}">{{ with .Params.photos }}{{ range first 1 . }}<img class="listening-card-art" src="{{ . }}" alt="" loading="lazy">{{ end }}{{ end }}<span class="listening-card-date">{{ .Date.Format "02 Jan 2006" }}</span><span class="listening-card-title">{{ .Title }}</span></a></article>{{ else }}<p>No listening posts are available yet.</p>{{ end }}</div></section>
