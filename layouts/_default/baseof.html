<!doctype html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} // {{ end }}{{ .Site.Title }}</title>
  <script>(function(){var s=localStorage.getItem('cactus-theme');var p=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',s||p)})();</script>
  {{ partial "microblog_head.html" . }}
  <link rel="stylesheet" href="{{ "css/screen.css" | relURL }}">
  <style>:root{--color-accent:{{ .Site.Params.accent_color | default "#b7db57" }};--color-link:var(--color-accent);--color-quote:var(--color-accent)}</style>
</head>
<body class="{{ if .IsPage }}site-post-body{{ else }}site-list-body{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="cactus-shell">
    {{ partial "header.html" . }}
    <main class="cactus-main" id="main">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
  </div>
  <script src="{{ "js/theme.js" | relURL }}" defer></script>
</body>
</html>
